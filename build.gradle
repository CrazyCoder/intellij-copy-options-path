import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.intellij.platform'
}

group = 'io.github.crazycoder.copysettingpath'
version = '1.4'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // Build against the lowest supported IDE.
        // The plugin supports 2025.1 (Java 21) up to 2026.2+ (Java 25). When the supported range
        // spans different Java requirements, the IntelliJ Platform docs require building against
        // the lowest version. Support for newer IDEs is added through reflection, never through
        // compile-time API, so the plugin keeps running on Java 21.
        intellijIdeaCommunity('2025.1.2')

        pluginVerifier()
        zipSigner()
        // Kotlin object, so Groovy needs the INSTANCE field. Named in full because the IntelliJ
        // Platform plugin is applied without a version from settings.gradle, so the IDE cannot
        // resolve an import of it even though Gradle can.
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }

    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
    useJUnit()
}

kotlin {
    jvmToolchain(21)

    compilerOptions {
        // 2025.1 bundles the Kotlin stdlib 2.1.10 and the plugin uses the bundled one.
        // Pin the API version to the oldest bundled stdlib so newer stdlib members,
        // which are absent at runtime on older IDEs, cannot be called.
        apiVersion = KotlinVersion.KOTLIN_2_1
    }
}

intellijPlatform {
    pluginConfiguration {
        name = 'Copy Setting Path'

        ideaVersion {
            sinceBuild = '251'
            untilBuild = provider { null }
        }

        changeNotes = """
            Fixed the Settings path in 2026.2 and later, where the Settings window is no longer a modal dialog.<br>
        """
    }

    signing {
        def signingDir = rootProject.file(".signing")
        def certFile = file("$signingDir/chain.crt")
        def keyFile = file("$signingDir/private.pem")

        // Use environment variables (CI/CD) or fall back to local .signing/ files
        certificateChain = providers.environmentVariable("CERTIFICATE_CHAIN")
        privateKey = providers.environmentVariable("PRIVATE_KEY")
        password = providers.environmentVariable("PRIVATE_KEY_PASSWORD")

        // File-based fallback for local development
        if (certFile.exists()) {
            certificateChainFile = certFile
        }
        if (keyFile.exists()) {
            privateKeyFile = keyFile
        }
    }

    pluginVerification {
        ides {
            // recommended() only resolves the Community branches, which stop at 2025.3, so on
            // its own it verified 251 and 252 and nothing newer. That is the wrong half of the
            // range: 2026.2 is where the plugin broke. The newer branches are named explicitly
            // and come from Ultimate, the only product still published for them.
            recommended()
            create {
                it.type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
                it.version = '2026.1.4'
            }
            create {
                it.type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
                it.version = '2026.2.0.1'
            }
        }
    }

    publishing {
        def tokenFile = rootProject.file(".signing/publish_token")
        // Use environment variable (CI/CD) or fall back to local .signing/publish_token file
        token = providers.environmentVariable("PUBLISH_TOKEN")
                .orElse(tokenFile.exists() ? providers.provider { tokenFile.text.trim() } : providers.provider { "" })
    }
}

// Extra run tasks to check the plugin against newer IDEs than the one it is compiled against.
// Each one gets its own sandbox, so `runIde` keeps its 2025.1 sandbox untouched.
intellijPlatformTesting {
    runIde {
        register('runIde20261') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.1.4'
        }
        register('runIde20262') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.2.0.1'
        }
    }

    // Run the test suite against IDEs newer than the compile target. The contract test asserts
    // that every platform internal the plugin reflects on still resolves, so a rename in a new
    // IDE shows up as a failing build here instead of as a bug report after release.
    testIde {
        register('test20261') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.1.4'
        }
        register('test20262') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.2.0.1'
        }
    }
}

tasks.named("buildSearchableOptions") {
    enabled = false
}
