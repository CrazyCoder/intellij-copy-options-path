import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.intellij.platform'
}

group = 'io.github.crazycoder.copysettingpath'
version = '1.5'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

// ---------------------------------------------------------------------------
// Secrets
// ---------------------------------------------------------------------------

/**
 * Reads a secret: the environment first, then a gitignored .env in the project root.
 *
 * CI sets real environment variables, a developer machine keeps a .env, and both use the same
 * names, so nothing about the build differs between them. Reading is lazy and goes through
 * Gradle's provider API, so the value is only resolved by the task that needs it and the build
 * stays compatible with the configuration cache.
 *
 * Returns a provider with no value when the secret is set in neither place. Tasks that need it
 * then fail saying so, instead of quietly using an empty string.
 *
 * A name that is present but blank counts as set in neither place. An unset GitHub Actions secret
 * expands to an empty string, and a placeholder line such as `PRIVATE_KEY=` is easy to leave in a
 * .env. Either one used to win over the `.signing/` files below and hand the signer an empty key,
 * which fails inside the signing tool with a NullPointerException and no hint of the cause.
 */
def dotEnvText = providers.fileContents(layout.projectDirectory.file('.env')).asText
def nonBlank = { p -> p.map { it.trim() }.filter { !it.isEmpty() } }
def secret = { String name ->
    nonBlank(providers.environmentVariable(name)).orElse(nonBlank(dotEnvText.map { text ->
        text.readLines()
                .collect { it.trim() }
                .find { !it.startsWith('#') && it.startsWith(name + '=') }
                ?.substring(name.length() + 1)
                ?.trim()
                ?.replaceAll(/^["']|["']$/, '')
    }))
}

dependencies {
    intellijPlatform {
        // Build against the lowest supported IDE.
        // The plugin supports 2025.1 (Java 21) up to 2026.2+ (Java 25). When the supported range
        // spans different Java requirements, the IntelliJ Platform docs require building against
        // the lowest version. Support for newer IDEs is added through reflection, never through
        // compile-time API, so the plugin keeps running on Java 21.
        intellijIdeaCommunity('2025.1.2')

        pluginVerifier()
        zipSigner()
        // Kotlin object, so Groovy needs the INSTANCE field. Named in full because the IntelliJ
        // Platform plugin is applied without a version from settings.gradle, so the IDE cannot
        // resolve an import of it even though Gradle can.
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }

    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
    useJUnit()
}

kotlin {
    jvmToolchain(21)

    compilerOptions {
        // 2025.1 bundles the Kotlin stdlib 2.1.10 and the plugin uses the bundled one.
        // Pin the API version to the oldest bundled stdlib so newer stdlib members,
        // which are absent at runtime on older IDEs, cannot be called.
        apiVersion = KotlinVersion.KOTLIN_2_1

        // Inherit interface default methods instead of generating a compatibility override for
        // each one. Without this, implementing DynamicPluginListener emits a bridge for every
        // method the class does not override, including the deprecated checkUnloadPlugin, which
        // the plugin verifier then reports as deprecated API usage the plugin never wrote.
        // The platform compiles the same way: its own listeners carry no such bridges.
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
    }
}

intellijPlatform {
    pluginConfiguration {
        name = 'Copy Setting Path'

        ideaVersion {
            sinceBuild = '251'
            untilBuild = provider { null }
        }

        changeNotes = """
            <ul>
              <li>The path now names the group a setting belongs to, such as "Sync external changes:" or "When tabs exceed the limit:". A group written as a title above indented checkboxes or radio buttons was missing from the path.</li>
              <li>Rider: the path to an inspection under Settings | Editor | Inspection Settings | Inspection Severity now names the group and the inspection, instead of an internal model reference.</li>
            </ul>
        """
    }

    signing {
        def signingDir = rootProject.file(".signing")
        def certFile = file("$signingDir/chain.crt")
        def keyFile = file("$signingDir/private.pem")

        // Environment or .env, then the local .signing/ files below
        certificateChain = secret('CERTIFICATE_CHAIN')
        privateKey = secret('PRIVATE_KEY')
        password = secret('PRIVATE_KEY_PASSWORD')

        // File-based fallback for local development
        if (certFile.exists()) {
            certificateChainFile = certFile
        }
        if (keyFile.exists()) {
            privateKeyFile = keyFile
        }
    }

    pluginVerification {
        ides {
            // recommended() only resolves the Community branches, which stop at 2025.3, so on
            // its own it verified 251 and 252 and nothing newer. That is the wrong half of the
            // range: 2026.2 is where the plugin broke. The newer branches are named explicitly
            // and come from Ultimate, the only product still published for them.
            recommended()
            create {
                it.type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
                it.version = '2026.1.4'
            }
            create {
                it.type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
                it.version = '2026.2.0.1'
            }
        }
    }

    publishing {
        // Environment or .env, then the legacy .signing/publish_token file.
        // No empty-string fallback: a missing token should fail the publish, not send "".
        def tokenFile = rootProject.file('.signing/publish_token')
        token = secret('PUBLISH_TOKEN')
                .orElse(providers.provider { tokenFile.exists() ? tokenFile.text.trim() : null })
    }
}

// Extra run tasks to check the plugin against newer IDEs than the one it is compiled against.
// Each one gets its own sandbox, so `runIde` keeps its 2025.1 sandbox untouched.
intellijPlatformTesting {
    runIde {
        register('runIde20261') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.1.4'
        }
        register('runIde20262') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.2.0.1'
        }
    }

    // Run the test suite against IDEs newer than the compile target. The contract test asserts
    // that every platform internal the plugin reflects on still resolves, so a rename in a new
    // IDE shows up as a failing build here instead of as a bug report after release.
    testIde {
        register('test20261') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.1.4'
        }
        register('test20262') {
            type = org.jetbrains.intellij.platform.gradle.IntelliJPlatformType.IntellijIdeaUltimate
            version = '2026.2.0.1'
        }
    }
}

tasks.named("buildSearchableOptions") {
    enabled = false
}

// verifyPluginSignature reads signPlugin's output but the plugin does not declare that
// dependency, so asking for both in one build fails Gradle's validation. Ordering them makes
// `gradlew signPlugin verifyPluginSignature` work, which is what a release run wants.
tasks.named('verifyPluginSignature') {
    mustRunAfter(tasks.named('signPlugin'))
}

/**
 * Prints the plugin version on its own line, for `gradlew --quiet printPluginVersion`.
 *
 * The release workflow checks it against the tag being released, so a tag that does not match the
 * version in this file fails before anything is published.
 */
tasks.register('printPluginVersion') {
    group = 'help'
    description = 'Prints the plugin version, with no other output.'

    def pluginVersion = project.version.toString()
    doLast { println pluginVersion }
}

/**
 * Prints the change notes as HTML, for `gradlew --quiet printChangeNotes`.
 *
 * The release workflow seeds the draft release notes with this, so the release always starts from
 * the notes that shipped in the plugin. GitHub renders the list markup. A human rewrites the text
 * before the release goes public.
 *
 * Every line is trimmed, because the source string is indented to sit inside this file and four
 * leading spaces turn a line into a code block in Markdown.
 */
tasks.register('printChangeNotes') {
    group = 'help'
    description = 'Prints the plugin change notes as HTML, with no other output.'

    def notes = intellijPlatform.pluginConfiguration.changeNotes
    doLast {
        println notes.get().readLines()*.trim().findAll { !it.isEmpty() }.join('\n')
    }
}

/**
 * Reports which release secrets resolve, and from where, without printing their values.
 *
 * Run before a release to check that .env or the environment is wired up, instead of finding
 * out from a failed publish.
 */
tasks.register('checkReleaseSecrets') {
    group = 'intellij platform'
    description = 'Reports which signing and publishing secrets are available, without printing them.'

    def names = ['PUBLISH_TOKEN', 'CERTIFICATE_CHAIN', 'PRIVATE_KEY', 'PRIVATE_KEY_PASSWORD']
    // Blank is filtered here too, so a blank variable is not reported as the origin of a .env value
    def fromEnv = names.collectEntries { n -> [n, nonBlank(providers.environmentVariable(n)).map { 'environment' }.orElse('')] }
    def resolved = names.collectEntries { n -> [n, secret(n).map { v -> v.trim().isEmpty() ? 'empty' : 'set' }.orElse('not set')] }
    def hasEnvFile = providers.provider { rootProject.file('.env').exists() }
    def signingFiles = ['chain.crt', 'private.pem', 'publish_token'].collectEntries { f ->
        [f, providers.provider { rootProject.file(".signing/$f").exists() }]
    }

    doLast {
        println '.env file present: ' + (hasEnvFile.get() ? 'yes' : 'no')
        names.each { n ->
            def source = fromEnv[n].get()
            def status = resolved[n].get()
            def origin = status == 'not set' ? '' : (source ? 'environment' : '.env')
            println '  ' + n.padRight(22) + status.padRight(10) + origin
        }
        println '.signing/ files:'
        signingFiles.each { f, present -> println '  ' + f.toString().padRight(22) + (present.get() ? 'present' : 'missing') }
    }
}
